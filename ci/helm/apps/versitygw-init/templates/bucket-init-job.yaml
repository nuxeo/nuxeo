apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bucket-init
  labels:
    app.kubernetes.io/name: versitygw-init
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # pre-install hook (weight 0, after the PVC at weight -1): Helm creates the
    # PVC first, then runs this Job and waits for it to complete. The Job pod
    # requesting the PVC triggers WaitForFirstConsumer binding immediately.
    # helmfile's `needs: versitygw-init` on the versitygw release then ensures
    # the bucket directory exists before VersityGW starts.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: bucket-init
        image: "{{ .Values.busyboxImage.repository }}:{{ .Values.busyboxImage.tag }}"
        imagePullPolicy: {{ .Values.busyboxImage.pullPolicy }}
        # The upstream versitygw chart mounts the PVC with subPath: data, so
        # VersityGW sees the PVC's data/ subdirectory as its storage root and
        # expects buckets at data/<bucket> inside the PVC. We mount the PVC
        # without a subPath (/data = PVC root), so the bucket directory must
        # be created at /data/data/<bucket>.
        command: [sh, -c, "mkdir -p /data/data/{{ .Values.bucket }}"]
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Values.pvcName }}
