name: "CodeQL"

on:
  push:
    branches: [ "2023", "2025" ]
  pull_request:
    branches: [ "2023", "2025" ]
  schedule:
    # At 01:00 on Sunday
    - cron: '0 1 * * SUN'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java', 'javascript' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
        # Use only 'java' to analyze code written in Java, Kotlin or both
        # Use only 'javascript' to analyze code written in JavaScript, TypeScript or both
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'maven'

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list here with "+" to use these queries and those in the config file.

          # Details on CodeQL's query packs refer to : https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
          # queries: security-extended,security-and-quality

          # Exclude Maven build output from analysis. Files under target/classes are
          # copies of source files (e.g. web resources under src/main/resources) and
          # produce duplicate alerts that shadow the true source-file alerts.
          config: |
            paths-ignore:
              - '**/target/**'

      # Run the build manually, we need several Maven commands with custom parameters to build the whole codebase
      - name: Build
        env:
          MAVEN_OPTS: >-
            -Xms2g -Xmx3g -XX:+TieredCompilation -XX:TieredStopAtLevel=1
            -Daether.syncContext.named.time=600
        run: |
          # Modules
          mvn install -B -e -nsu -DskipTests -T4C -V
          # Server
          mvn install -B -e -nsu -DskipTests -f server/pom.xml
          # Packages
          mvn package -B -e -nsu -DskipTests -f packages/pom.xml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:${{matrix.language}}"
