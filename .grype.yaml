ignore:
  # CVE-2026-0603 / GHSA-2p5w-cvg5-gc5c — Hibernate SQL injection via InlineIdsOrClauseBuilder
  # hibernate-core is used in nuxeo-core-persistence purely as a JPA configuration/lifecycle
  # provider. No bulk HQL DELETE/UPDATE statements are executed anywhere in the codebase, so
  # InlineIdsOrClauseBuilder is never invoked. Not exploitable in the current codebase.
  # Tracked in: NXP-33596
  - vulnerability: GHSA-2p5w-cvg5-gc5c
    package:
      fix-state: not-fixed
      name: hibernate-core
      type: java-archive
